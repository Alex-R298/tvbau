<section class="contact-section">
    <div class="iso-grid-bg">
        <div class="grid-plane"></div>
    </div>

    <div class="container">
        <div class="split-layout">
            
            <div class="form-wrapper">
                <div class="form-header">
                    <span class="mono-label">Projektanfrage</span>
                    <h2>Starten wir das <br><span class="text-stroke">Fundament.</span></h2>
                </div>

                <form (ngSubmit)="onSubmit()" class="architect-form">
                    
                    <div class="input-grid">
                        <div class="input-group">
                            <label>Vorname</label>
                            <input type="text" [(ngModel)]="formData.vorname" name="vorname" placeholder="Max" required>
                        </div>
                        <div class="input-group">
                            <label>Nachname</label>
                            <input type="text" [(ngModel)]="formData.name" name="name" placeholder="Mustermann" required>
                        </div>
                    </div>

                    <div class="input-grid">
                        <div class="input-group">
                            <label>E-Mail</label>
                            <input type="email" [(ngModel)]="formData.email" name="email" placeholder="max@firma.de" required>
                        </div>
                        <div class="input-group">
                            <label>Telefon</label>
                            <input type="tel" [(ngModel)]="formData.telefon" name="telefon" placeholder="+49 ..." required>
                        </div>
                    </div>

                    <div class="selection-area">
                        <label>Worum geht es?</label>
                        <div class="tile-grid">
                            <div class="tile" 
                                 *ngFor="let option of leistungen" 
                                 [class.active]="formData.leistung === option"
                                 (click)="selectLeistung(option)">
                                <span class="tile-check" *ngIf="formData.leistung === option">✓</span>
                                {{ option }}
                            </div>
                        </div>
                    </div>

                    <div class="input-group full-width">
                        <label>Projektdetails</label>
                        <textarea [(ngModel)]="formData.nachricht" name="nachricht" rows="4" placeholder="Lage, Größe, Zeitrahmen..."></textarea>
                    </div>

                    <div class="upload-area" 
                         [class.dragging]="isDragging"
                         (dragover)="onDragOver($event)" 
                         (dragleave)="onDragLeave($event)" 
                         (drop)="onDrop($event)"
                         (click)="fileInput.click()">
                        
                        <input #fileInput type="file" multiple hidden (change)="onFileSelect($event)">
                        
                        <div class="upload-content">
                            <span class="icon">＋</span>
                            <span class="text">Dateien / Pläne hinzufügen</span>
                            <span class="sub">Max. 10MB • PDF, JPG, PNG</span>
                        </div>
                    </div>

                    <div class="file-list" *ngIf="uploadedImages.length > 0">
                        <div class="file-item" *ngFor="let file of uploadedImages">
                            <span class="file-name">{{ file.file.name }}</span>
                            <span class="remove" (click)="removeImage(file.id)">✕</span>
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">
                        <span class="btn-text">Anfrage senden</span>
                        <span class="btn-icon">→</span>
                    </button>
                </form>
            </div>

            <div class="info-wrapper">
                <div class="sticky-content">
                    
                    <div class="contact-display">
                        <div class="cd-label">Büro</div>
                        <a href="tel:+49123456789" class="cd-link">+49 711 500 40</a>
                    </div>

                    <div class="contact-display">
                        <div class="cd-label">Digital</div>
                        <a href="mailto:info@tvbau.de" class="cd-link">info&#64;tvbau.de</a>
                    </div>

                    <div class="divider"></div>

                    <div class="status-indicator">
                        <span class="dot pulse"></span>
                        <span>Wir sind aktuell erreichbar</span>
                    </div>

                    <div class="location-visual">
                        <div class="map-overlay">
                            <div class="radar-scan"></div>
                            <div class="location-point">
                                <div class="point-label">Hauptsitz</div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>
