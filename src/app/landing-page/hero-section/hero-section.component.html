<section class="hero">
    
    <div class="video-container">
        <video autoplay loop muted playsinline class="hero-video">
            <source src="../../../assets/img/tvbau.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <canvas #blueprintCanvas class="blueprint-canvas"></canvas>

    <div class="hero-grid-container">
        
        <div class="content-box">
            
            <div class="corner-mark top-left"></div>
            <div class="corner-mark bottom-right"></div>

            <div class="badge-container">
                <span class="status-dot"></span>
                <span class="meta-text">Meisterbetrieb est. 1999</span>
            </div>

            <h1 class="hero-title">
                <span class="d-block">Präzision</span>
                <span class="d-block text-outline">am Bau</span>
            </h1>

            <p class="hero-description">
                Ihr Partner für anspruchsvolle Bauvorhaben in Schwäbisch Gmünd. 
                Qualität, die bleibt – seit über 25 Jahren.
            </p>

            <div class="action-wrapper">
                <button class="btn-tech">
                    <span class="btn-bg"></span>
                    <span class="btn-text">Projekt anfragen</span>
                    <span class="btn-icon">→</span>
                </button>
                <div class="tech-specs">
                    <span>REF: 500+</span>
                    <span>LOC: GD</span>
                </div>
            </div>
        </div>

        <div class="visual-space">
            <div class="vertical-line"></div>
            <div class="coordinate-display">
                X: 48.801 | Y: 9.798
            </div>
        </div>

    </div>

    <div class="bottom-bar">
        <div class="scroll-trigger">
            <span class="scroll-text">Scroll Down</span>
            <div class="scroll-track">
                <div class="scroll-bullet"></div>
            </div>
        </div>
    </div>

</section>
